name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build, test, and validate
    runs-on: ubuntu-latest

    env:
      VERSION: 0.0.0-alpha.${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore MuLang.slnx --locked-mode

      - name: Test Debug
        run: dotnet test MuLang.slnx --configuration Debug --no-restore --nologo --verbosity minimal -p:Version=${{ env.VERSION }}

      - name: Test Release
        run: dotnet test MuLang.slnx --configuration Release --no-restore --nologo --verbosity minimal -p:Version=${{ env.VERSION }}

      - name: Build documentation
        run: dotnet tool run docfx docs/docfx.json --warningsAsErrors

      - name: Pack
        run: dotnet pack MuLang.slnx --configuration Release --no-build --no-restore --nologo --verbosity minimal --output artifacts/packages -p:Version=${{ env.VERSION }}

      - name: Verify packages
        shell: pwsh
        run: |
          ./eng/Verify-Packages.ps1 `
            -PackageDirectory "artifacts/packages" `
            -Version $env:VERSION `
            -ExpectedRepositoryCommit "${{ github.sha }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-packages-${{ github.run_number }}
          path: artifacts/packages/*
          if-no-files-found: error
