name: Publish release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      create_github_release: ${{ steps.release.outputs.create_github_release }}
      package_release_notes: ${{ steps.release.outputs.package_release_notes }}
      release_notes_file: ${{ steps.release.outputs.release_notes_file }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive package version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $versionPattern = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(alpha|beta|rc)\.([1-9][0-9]*))?$'

          if ($version -notmatch $versionPattern) {
            throw "Tag '$env:RELEASE_TAG' does not contain a valid release version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "## MuLang release" >> $env:GITHUB_STEP_SUMMARY
          "- Tag: ``$env:RELEASE_TAG``" >> $env:GITHUB_STEP_SUMMARY
          "- Version: ``$version``" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: ``${{ github.sha }}``" >> $env:GITHUB_STEP_SUMMARY

      - name: Determine release metadata
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $prerelease = $env:VERSION.IndexOf('-', [StringComparison]::Ordinal)
          $channel = if ($prerelease -lt 0) {
            ''
          } else {
            $env:VERSION.Substring($prerelease + 1).Split('.')[0]
          }
          $isStable = $channel -eq ''
          $createGitHubRelease = $channel -in '', 'beta', 'rc'
          $history = ./eng/Get-ReleaseHistory.ps1 -Version $env:VERSION
          $isFirstRelease = !$history.HasPreviousRelease
          $isFirstStable = $isStable -and !$history.HasPreviousStable
          [string] $stableNotes = ./eng/Get-ChangelogReleaseNotes.ps1 `
            -Path 'CHANGELOG.md' `
            -Version $env:VERSION `
            -AllowMissing
          [string] $detailedNotes = ./eng/Get-ChangelogReleaseNotes.ps1 `
            -Path 'CHANGELOG.detailed.md' `
            -Version $env:VERSION `
            -AllowMissing
          $hasStableNotes = ![string]::IsNullOrWhiteSpace($stableNotes)
          $hasDetailedNotes = ![string]::IsNullOrWhiteSpace($detailedNotes)

          if (!$isFirstRelease -and !$hasDetailedNotes) {
            throw "CHANGELOG.detailed.md does not contain release notes for version '$env:VERSION'."
          }

          if ($isStable -and !$isFirstStable -and !$hasStableNotes) {
            throw "CHANGELOG.md does not contain consolidated release notes for version '$env:VERSION'."
          }

          if (!$isStable -and $hasStableNotes) {
            throw "CHANGELOG.md must not contain prerelease version '$env:VERSION'."
          }

          $packageReleaseNotes = if ($createGitHubRelease) {
            "https://github.com/FstTesla/MuLang/releases/tag/$env:RELEASE_TAG"
          } elseif ($hasDetailedNotes) {
            "https://github.com/FstTesla/MuLang/blob/$env:RELEASE_TAG/CHANGELOG.detailed.md"
          } else {
            ''
          }
          $releaseNotesFile = if ($hasStableNotes) {
            'CHANGELOG.md'
          } elseif ($hasDetailedNotes) {
            'CHANGELOG.detailed.md'
          } else {
            ''
          }

          "create_github_release=$($createGitHubRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "package_release_notes=$packageReleaseNotes" >> $env:GITHUB_OUTPUT
          "release_notes_file=$releaseNotesFile" >> $env:GITHUB_OUTPUT

  pack:
    name: Build, test, and pack
    needs: prepare
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/FstTesla/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore MuLang.CrossPlatform.slnx --locked-mode

      - name: Build
        run: dotnet build MuLang.CrossPlatform.slnx --configuration Release --no-restore --nologo --verbosity minimal -p:Version=${{ needs.prepare.outputs.version }}

      - name: Test
        run: dotnet test MuLang.CrossPlatform.slnx --configuration Release --no-build --no-restore --nologo --verbosity minimal

      - name: Pack
        run: dotnet pack MuLang.CrossPlatform.slnx --configuration Release --no-build --no-restore --nologo --verbosity minimal --output artifacts/packages -p:Version=${{ needs.prepare.outputs.version }} -p:PackageReleaseNotes="${{ needs.prepare.outputs.package_release_notes }}"

      - name: Verify package artifacts
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./eng/Verify-Packages.ps1 `
            -PackageDirectory "artifacts/packages" `
            -Version $env:VERSION `
            -ExpectedRepositoryCommit "${{ github.sha }}" `
            -TestSourceLinkUrls

          "### Artifact hashes" >> $env:GITHUB_STEP_SUMMARY
          $packages = @(Get-ChildItem artifacts/packages -File)

          foreach ($package in $packages) {
            $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "- ``$($package.Name)``: ``$hash``" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuGet-${{ needs.prepare.outputs.version }}
          path: artifacts/packages/*
          if-no-files-found: error

  vsix:
    name: Build and verify VSIX
    needs: prepare
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Derive VSIX version
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $vsixVersion = ./eng/Get-VsixVersion.ps1 -Version $env:VERSION
          "VSIX_VERSION=$vsixVersion" >> $env:GITHUB_ENV
          "### VSIX" >> $env:GITHUB_STEP_SUMMARY
          "- Version: ``$vsixVersion``" >> $env:GITHUB_STEP_SUMMARY

      - name: Restore
        run: dotnet restore src\MuLang.VisualStudio\MuLang.VisualStudio.csproj --locked-mode

      - name: Build VSIX
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dotnet build src\MuLang.VisualStudio\MuLang.VisualStudio.csproj `
            --configuration Release `
            --no-restore `
            --nologo `
            --verbosity minimal `
            -p:Version=$env:VERSION `
            -p:VsixVersion=$env:VSIX_VERSION

      - name: Prepare and verify VSIX artifact
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item artifacts\vsix -ItemType Directory -Force | Out-Null
          $artifact = "artifacts\vsix\MuLang.VisualStudio.$env:VERSION.vsix"
          Copy-Item `
            src\MuLang.VisualStudio\bin\Release\net472\MuLang.VisualStudio.vsix `
            $artifact
          ./eng/Verify-Vsix.ps1 `
            -Path $artifact `
            -Version $env:VSIX_VERSION
          $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          "- Artifact: ``$artifact``" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSIX-${{ needs.prepare.outputs.version }}
          path: artifacts/vsix/*
          if-no-files-found: error

  publish:
    name: Publish packages and release
    needs:
      - prepare
      - pack
      - vsix
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: NuGet-${{ needs.prepare.outputs.version }}
          path: artifacts/packages

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: VSIX-${{ needs.prepare.outputs.version }}
          path: artifacts/vsix

      - name: Prepare GitHub release notes
        if: needs.prepare.outputs.create_github_release == 'true' && needs.prepare.outputs.release_notes_file != ''
        shell: pwsh
        env:
          RELEASE_NOTES_FILE: ${{ needs.prepare.outputs.release_notes_file }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          [string] $notes = ./eng/Get-ChangelogReleaseNotes.ps1 `
            -Path $env:RELEASE_NOTES_FILE `
            -Version $env:VERSION

          [System.IO.File]::WriteAllText(
            'artifacts/release-notes.md',
            $notes,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          source-url: https://nuget.pkg.github.com/FstTesla/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}

      - name: Restore tools
        run: dotnet tool restore

      - name: Publish packages
        shell: pwsh
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
        run: |
          $packages = @(Get-ChildItem artifacts/packages -Filter *.nupkg -File)

          if ($packages.Count -eq 0) {
            throw 'No NuGet packages are available for publication.'
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key $env:NUGET_AUTH_TOKEN `
              --source https://nuget.pkg.github.com/FstTesla/index.json

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Verify published packages
        shell: pwsh
        env:
          GITHUB_PACKAGE_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./eng/Verify-Packages.ps1 `
            -PackageDirectory "artifacts/packages" `
            -Version $env:VERSION `
            -ExpectedRepositoryCommit "${{ github.sha }}" `
            -TestSourceLinkUrls `
            -FeedUrl 'https://nuget.pkg.github.com/FstTesla/index.json' `
            -FeedUsername '${{ github.actor }}' `
            -FeedToken $env:GITHUB_PACKAGE_TOKEN `
            -GitHubOwner 'FstTesla' `
            -GitHubRepository 'MuLang' `
            -GitHubToken $env:GITHUB_PACKAGE_TOKEN `
            -ExpectedGitHubVisibility 'public'

      - name: Create GitHub release
        if: needs.prepare.outputs.create_github_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $vsixArtifacts = @(
            Get-ChildItem artifacts/vsix -Filter *.vsix -File
          )

          if ($vsixArtifacts.Count -ne 1) {
            throw "Expected one VSIX artifact, found '$($vsixArtifacts.Count)'."
          }

          $arguments = @(
            'release',
            'create',
            $env:RELEASE_TAG,
            '--verify-tag',
            '--title',
            "MuLang $env:VERSION"
          )

          if (Test-Path 'artifacts/release-notes.md') {
            $arguments += @(
              '--notes-file',
              'artifacts/release-notes.md'
            )
          } else {
            $arguments += @('--notes', '')
          }

          if ($env:VERSION.Contains('-', [StringComparison]::Ordinal)) {
            $arguments += '--prerelease'
          }

          $arguments += $vsixArtifacts[0].FullName
          & gh @arguments

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
