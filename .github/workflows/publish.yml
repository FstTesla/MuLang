name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      create_github_release: ${{ steps.release.outputs.create_github_release }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/FstTesla/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}

      - name: Restore tools
        run: dotnet tool restore

      - name: Derive package version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $versionPattern = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(alpha|beta|rc)\.([1-9][0-9]*))?$'

          if ($version -notmatch $versionPattern) {
            throw "Tag '$env:RELEASE_TAG' does not contain a valid release version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "## NuGet release" >> $env:GITHUB_STEP_SUMMARY
          "- Tag: ``$env:RELEASE_TAG``" >> $env:GITHUB_STEP_SUMMARY
          "- Version: ``$version``" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: ``${{ github.sha }}``" >> $env:GITHUB_STEP_SUMMARY

      - name: Determine package validation baseline
        shell: pwsh
        env:
          BASELINE_OVERRIDE: ${{ vars.PACKAGE_VALIDATION_BASELINE_VERSION }}
          GITHUB_PACKAGE_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $versionPattern = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(alpha|beta|rc)\.([1-9][0-9]*))?$'

          function ConvertTo-VersionInfo([string] $value) {
            $match = [regex]::Match($value, $versionPattern)

            if (!$match.Success) {
              return $null
            }

            $channel = $match.Groups[4].Value
            $channelRank = switch ($channel) {
              'alpha' { 0 }
              'beta' { 1 }
              'rc' { 2 }
              default { 3 }
            }
            $sequence = if ($match.Groups[5].Success) {
              [long]$match.Groups[5].Value
            } else {
              0
            }

            return [PSCustomObject]@{
              Text = $value
              Major = [long]$match.Groups[1].Value
              Minor = [long]$match.Groups[2].Value
              Patch = [long]$match.Groups[3].Value
              ChannelRank = $channelRank
              Sequence = $sequence
            }
          }

          function Compare-VersionInfo($left, $right) {
            foreach ($property in 'Major', 'Minor', 'Patch', 'ChannelRank', 'Sequence') {
              if ($left.$property -lt $right.$property) {
                return -1
              }

              if ($left.$property -gt $right.$property) {
                return 1
              }
            }

            return 0
          }

          $current = ConvertTo-VersionInfo $env:VERSION
          $override = $env:BASELINE_OVERRIDE.Trim()

          if ($override.Equals('none', [StringComparison]::OrdinalIgnoreCase)) {
            '- Package validation baseline: disabled by repository variable.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_PACKAGE_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'MuLang-package-validation'
          }
          $published = [System.Collections.Generic.List[object]]::new()

          for ($page = 1; ; $page++) {
            $url = "https://api.github.com/users/FstTesla/packages/nuget/MuLang/versions?per_page=100&page=$page"

            try {
              $items = @(Invoke-RestMethod -Uri $url -Headers $headers)
            } catch {
              if ($_.Exception.Response.StatusCode -eq [System.Net.HttpStatusCode]::NotFound) {
                $items = @()
              } else {
                throw
              }
            }

            foreach ($item in $items) {
              $version = ConvertTo-VersionInfo $item.name

              if ($null -ne $version) {
                $published.Add($version)
              }
            }

            if ($items.Count -lt 100) {
              break
            }
          }

          if (![string]::IsNullOrWhiteSpace($override)) {
            $baseline = ConvertTo-VersionInfo $override

            if ($null -eq $baseline) {
              throw "Repository variable PACKAGE_VALIDATION_BASELINE_VERSION contains invalid version '$override'."
            }

            if ((Compare-VersionInfo $baseline $current) -ge 0) {
              throw "Package validation baseline '$override' must precede '$env:VERSION'."
            }

            if ($override -notin @($published | ForEach-Object Text)) {
              throw "Package validation baseline '$override' is not published on GitHub Packages."
            }
          } else {
            $baseline = $published |
              Where-Object {
                (Compare-VersionInfo $_ $current) -lt 0
              } |
              Sort-Object Major, Minor, Patch, ChannelRank, Sequence |
              Select-Object -Last 1
          }

          if ($null -eq $baseline) {
            '- Package validation baseline: none; this is the first published version.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          "PackageValidationBaselineVersion=$($baseline.Text)" >> $env:GITHUB_ENV
          "- Package validation baseline: ``$($baseline.Text)``" >> $env:GITHUB_STEP_SUMMARY

      - name: Determine release metadata
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $prerelease = $env:VERSION.IndexOf('-', [StringComparison]::Ordinal)
          $channel = if ($prerelease -lt 0) {
            ''
          } else {
            $env:VERSION.Substring($prerelease + 1).Split('.')[0]
          }
          $createGitHubRelease = $channel -in '', 'beta', 'rc'
          $changelog = [System.IO.File]::ReadAllText('CHANGELOG.md')
          $escapedVersion = [regex]::Escape($env:VERSION)
          $pattern = "(?ms)^## \[$escapedVersion\] - [^\r\n]+\r?\n\r?\n(?<notes>.*?)(?=^## |\z)"
          $hasReleaseNotes = [regex]::IsMatch($changelog, $pattern)

          if ($createGitHubRelease -and !$hasReleaseNotes) {
            throw "CHANGELOG.md does not contain release notes for version '$env:VERSION'."
          }

          $packageReleaseNotes = if ($createGitHubRelease) {
            "https://github.com/FstTesla/MuLang/releases/tag/$env:RELEASE_TAG"
          } elseif ($hasReleaseNotes) {
            "https://github.com/FstTesla/MuLang/blob/$env:RELEASE_TAG/CHANGELOG.md"
          } else {
            ''
          }

          "create_github_release=$($createGitHubRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "package_release_notes=$packageReleaseNotes" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore MuLang.slnx --locked-mode

      - name: Build
        run: dotnet build MuLang.slnx --configuration Release --no-restore --nologo --verbosity minimal -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test MuLang.slnx --configuration Release --no-build --no-restore --nologo --verbosity minimal

      - name: Pack
        run: dotnet pack MuLang.slnx --configuration Release --no-build --no-restore --nologo --verbosity minimal --output artifacts/packages -p:Version=${{ steps.version.outputs.version }} -p:PackageReleaseNotes="${{ steps.release.outputs.package_release_notes }}"

      - name: Verify package artifacts
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./eng/Verify-Package.ps1 `
            -PackagePath "artifacts/packages/MuLang.$env:VERSION.nupkg" `
            -SymbolPackagePath "artifacts/packages/MuLang.$env:VERSION.snupkg" `
            -Version $env:VERSION `
            -ExpectedRepositoryCommit "${{ github.sha }}" `
            -TestSourceLinkUrls

          "### Artifact hashes" >> $env:GITHUB_STEP_SUMMARY
          $packages = @(Get-ChildItem artifacts/packages -File)

          foreach ($package in $packages) {
            $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "- ``$($package.Name)``: ``$hash``" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuGet-${{ steps.version.outputs.version }}
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages
    needs: pack
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: NuGet-${{ needs.pack.outputs.version }}
          path: artifacts/packages

      - name: Prepare GitHub release notes
        if: needs.pack.outputs.create_github_release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          $changelog = [System.IO.File]::ReadAllText('CHANGELOG.md')
          $escapedVersion = [regex]::Escape($env:VERSION)
          $pattern = "(?ms)^## \[$escapedVersion\] - [^\r\n]+\r?\n\r?\n(?<notes>.*?)(?=^## |\z)"
          $match = [regex]::Match($changelog, $pattern)

          if (!$match.Success) {
            throw "CHANGELOG.md does not contain release notes for version '$env:VERSION'."
          }

          $notes = $match.Groups['notes'].Value.Trim()

          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "Release notes for version '$env:VERSION' are empty."
          }

          [System.IO.File]::WriteAllText(
            'artifacts/release-notes.md',
            $notes,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          source-url: https://nuget.pkg.github.com/FstTesla/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}

      - name: Restore tools
        run: dotnet tool restore

      - name: Publish packages
        shell: pwsh
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
        run: |
          $packages = @(Get-ChildItem artifacts/packages -Filter *.nupkg -File)

          if ($packages.Count -eq 0) {
            throw 'No NuGet packages are available for publication.'
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key $env:NUGET_AUTH_TOKEN `
              --source https://nuget.pkg.github.com/FstTesla/index.json

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Verify published package
        shell: pwsh
        env:
          GITHUB_PACKAGE_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          ./eng/Verify-Package.ps1 `
            -PackagePath "artifacts/packages/MuLang.$env:VERSION.nupkg" `
            -SymbolPackagePath "artifacts/packages/MuLang.$env:VERSION.snupkg" `
            -Version $env:VERSION `
            -ExpectedRepositoryCommit "${{ github.sha }}" `
            -TestSourceLinkUrls `
            -FeedUrl 'https://nuget.pkg.github.com/FstTesla/index.json' `
            -FeedUsername '${{ github.actor }}' `
            -FeedToken $env:GITHUB_PACKAGE_TOKEN `
            -GitHubOwner 'FstTesla' `
            -GitHubRepository 'MuLang' `
            -GitHubToken $env:GITHUB_PACKAGE_TOKEN `
            -ExpectedGitHubVisibility 'private'

      - name: Create GitHub release
        if: needs.pack.outputs.create_github_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          $arguments = @(
            'release',
            'create',
            $env:RELEASE_TAG,
            '--verify-tag',
            '--title',
            "MuLang $env:VERSION",
            '--notes-file',
            'artifacts/release-notes.md'
          )

          if ($env:VERSION.Contains('-', [StringComparison]::Ordinal)) {
            $arguments += '--prerelease'
          }

          & gh @arguments

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
