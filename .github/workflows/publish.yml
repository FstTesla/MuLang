name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      create_github_release: ${{ steps.release.outputs.create_github_release }}
      release_notes_file: ${{ steps.release.outputs.release_notes_file }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/FstTesla/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}

      - name: Restore tools
        run: dotnet tool restore

      - name: Derive package version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $versionPattern = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(alpha|beta|rc)\.([1-9][0-9]*))?$'

          if ($version -notmatch $versionPattern) {
            throw "Tag '$env:RELEASE_TAG' does not contain a valid release version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "## NuGet release" >> $env:GITHUB_STEP_SUMMARY
          "- Tag: ``$env:RELEASE_TAG``" >> $env:GITHUB_STEP_SUMMARY
          "- Version: ``$version``" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: ``${{ github.sha }}``" >> $env:GITHUB_STEP_SUMMARY

      - name: Determine release metadata
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $prerelease = $env:VERSION.IndexOf('-', [StringComparison]::Ordinal)
          $channel = if ($prerelease -lt 0) {
            ''
          } else {
            $env:VERSION.Substring($prerelease + 1).Split('.')[0]
          }
          $isStable = $channel -eq ''
          $createGitHubRelease = $channel -in '', 'beta', 'rc'
          $stableChangelog = [System.IO.File]::ReadAllText('CHANGELOG.md')
          $detailedChangelog = [System.IO.File]::ReadAllText(
            'CHANGELOG.detailed.md'
          )
          $escapedVersion = [regex]::Escape($env:VERSION)
          $pattern =
            '(?ms)^## `' +
            $escapedVersion +
            '` - [^\r\n]+\r?\n\r?\n(?<notes>.*?)(?=^## |\z)'
          $hasStableNotes = [regex]::IsMatch($stableChangelog, $pattern)
          $hasDetailedNotes = [regex]::IsMatch($detailedChangelog, $pattern)

          if ($createGitHubRelease -and !$hasDetailedNotes) {
            throw "CHANGELOG.detailed.md does not contain release notes for version '$env:VERSION'."
          }

          if ($isStable -and !$hasStableNotes) {
            throw "CHANGELOG.md does not contain consolidated release notes for version '$env:VERSION'."
          }

          if (!$isStable -and $hasStableNotes) {
            throw "CHANGELOG.md must not contain prerelease version '$env:VERSION'."
          }

          $packageReleaseNotes = if ($createGitHubRelease) {
            "https://github.com/FstTesla/MuLang/releases/tag/$env:RELEASE_TAG"
          } elseif ($hasDetailedNotes) {
            "https://github.com/FstTesla/MuLang/blob/$env:RELEASE_TAG/CHANGELOG.detailed.md"
          } else {
            ''
          }
          $releaseNotesFile = if ($isStable) {
            'CHANGELOG.md'
          } elseif ($createGitHubRelease) {
            'CHANGELOG.detailed.md'
          } else {
            ''
          }

          "create_github_release=$($createGitHubRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "package_release_notes=$packageReleaseNotes" >> $env:GITHUB_OUTPUT
          "release_notes_file=$releaseNotesFile" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore MuLang.slnx --locked-mode

      - name: Build
        run: dotnet build MuLang.slnx --configuration Release --no-restore --nologo --verbosity minimal -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test MuLang.slnx --configuration Release --no-build --no-restore --nologo --verbosity minimal

      - name: Pack
        run: dotnet pack MuLang.slnx --configuration Release --no-build --no-restore --nologo --verbosity minimal --output artifacts/packages -p:Version=${{ steps.version.outputs.version }} -p:PackageReleaseNotes="${{ steps.release.outputs.package_release_notes }}"

      - name: Verify package artifacts
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./eng/Verify-Packages.ps1 `
            -PackageDirectory "artifacts/packages" `
            -Version $env:VERSION `
            -ExpectedRepositoryCommit "${{ github.sha }}" `
            -TestSourceLinkUrls

          "### Artifact hashes" >> $env:GITHUB_STEP_SUMMARY
          $packages = @(Get-ChildItem artifacts/packages -File)

          foreach ($package in $packages) {
            $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "- ``$($package.Name)``: ``$hash``" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuGet-${{ steps.version.outputs.version }}
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages
    needs: pack
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: NuGet-${{ needs.pack.outputs.version }}
          path: artifacts/packages

      - name: Prepare GitHub release notes
        if: needs.pack.outputs.create_github_release == 'true'
        shell: pwsh
        env:
          RELEASE_NOTES_FILE: ${{ needs.pack.outputs.release_notes_file }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          $changelog = [System.IO.File]::ReadAllText(
            $env:RELEASE_NOTES_FILE
          )
          $escapedVersion = [regex]::Escape($env:VERSION)
          $pattern =
            '(?ms)^## `' +
            $escapedVersion +
            '` - [^\r\n]+\r?\n\r?\n(?<notes>.*?)(?=^## |\z)'
          $match = [regex]::Match($changelog, $pattern)

          if (!$match.Success) {
            throw "'$env:RELEASE_NOTES_FILE' does not contain release notes for version '$env:VERSION'."
          }

          $notes = $match.Groups['notes'].Value.Trim()

          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "Release notes for version '$env:VERSION' are empty."
          }

          [System.IO.File]::WriteAllText(
            'artifacts/release-notes.md',
            $notes,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          source-url: https://nuget.pkg.github.com/FstTesla/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}

      - name: Restore tools
        run: dotnet tool restore

      - name: Publish packages
        shell: pwsh
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
        run: |
          $packages = @(Get-ChildItem artifacts/packages -Filter *.nupkg -File)

          if ($packages.Count -eq 0) {
            throw 'No NuGet packages are available for publication.'
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key $env:NUGET_AUTH_TOKEN `
              --source https://nuget.pkg.github.com/FstTesla/index.json

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Verify published packages
        shell: pwsh
        env:
          GITHUB_PACKAGE_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          ./eng/Verify-Packages.ps1 `
            -PackageDirectory "artifacts/packages" `
            -Version $env:VERSION `
            -ExpectedRepositoryCommit "${{ github.sha }}" `
            -TestSourceLinkUrls `
            -FeedUrl 'https://nuget.pkg.github.com/FstTesla/index.json' `
            -FeedUsername '${{ github.actor }}' `
            -FeedToken $env:GITHUB_PACKAGE_TOKEN `
            -GitHubOwner 'FstTesla' `
            -GitHubRepository 'MuLang' `
            -GitHubToken $env:GITHUB_PACKAGE_TOKEN `
            -ExpectedGitHubVisibility 'public'

      - name: Create GitHub release
        if: needs.pack.outputs.create_github_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          $arguments = @(
            'release',
            'create',
            $env:RELEASE_TAG,
            '--verify-tag',
            '--title',
            "MuLang $env:VERSION",
            '--notes-file',
            'artifacts/release-notes.md'
          )

          if ($env:VERSION.Contains('-', [StringComparison]::Ordinal)) {
            $arguments += '--prerelease'
          }

          & gh @arguments

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
