name: Publish documentation

on:
  push:
    branches:
      - main
    paths:
      - '.config/dotnet-tools.json'
      - '.github/workflows/documentation.yml'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'MuLang.png'
      - 'docs/docfx.json'
      - 'docs/public/**'
      - 'global.json'
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore MuLang.slnx --locked-mode

      - name: Build
        run: dotnet build MuLang.slnx --configuration Release --no-restore --nologo --verbosity minimal

      - name: Build documentation
        run: dotnet tool run docfx docs/docfx.json --warningsAsErrors

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/docs/site

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
